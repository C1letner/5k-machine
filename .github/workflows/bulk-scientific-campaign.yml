name: Bulk Scientific Research Campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Discovery testing batch 1
        run: npm run test:hypotheses
      - name: Discovery testing batch 2
        run: npm run test:hypotheses
      - name: Discovery testing batch 3
        run: npm run test:hypotheses
      - name: Discovery testing batch 4
        run: npm run test:hypotheses
      - name: Discovery testing batch 5
        run: npm run test:hypotheses
      - name: Discovery testing batch 6
        run: npm run test:hypotheses
      - name: False discovery control
        run: npm run fdr
      - name: Adversarial prosecution
        run: npm run science
      - name: Holdout replication
        run: npm run replicate
      - name: Forward lab registration
        run: npm run forward
