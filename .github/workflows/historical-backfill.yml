name: Historical Data Backfill
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of hourly history to backfill (build 043; 1095 = 3 years)"
        required: true
        default: "1095"
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKFILL_DAYS: ${{ inputs.days }}
