name: XRP-001 Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Run XRP-001
        run: npm run research:xrp001
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: xrp001-result
          path: research/results/xrp001.json
